repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--select, "E,F,I,B,UP"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (unit/integration/smoke; no GPU/dataset)
        entry: uv run pytest -m "not e2e and not gpu and not slow" -q
        language: system
        pass_filenames: false
        always_run: true
