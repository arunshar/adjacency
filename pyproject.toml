[project]
name = "adjacency"
version = "0.1.0"
description = "A brand-safety policy engine. Compiles advertiser prose into a typed, hashed, diffable PolicySpec, evaluates inventory multimodally, and passes every verdict through deterministic fail-closed gates before reporting the delta against a keyword blocklist."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# Model and network layer. Kept separate so the deterministic core, which is the
# half that decides most inventory, installs and tests with no model dependency
# at all. `pip install -e .` is enough to run every gate test.
model = [
    "litellm>=1.0.0",
    "httpx>=0.28.1",
    "Pillow>=10.0.0",
]
serve = [
    "gradio>=5.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adjacency"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not e2e' -ra"
testpaths = ["tests"]
markers = [
    "unit: fast hermetic unit tests (no network)",
    "integration: local-fixture integration tests",
    "smoke: wiring/import smoke tests",
    "e2e: end-to-end, requires live API credentials",
    "slow: long-running",
]

[tool.coverage.run]
branch = true
source = ["src/adjacency"]

[tool.coverage.report]
# The gate and delta modules are the ones a judge will actually read, and they are
# pure functions with no excuse for uncovered branches. The floor is the whole-package
# floor; the gates are held to 100 percent by their own test module.
fail_under = 90
skip_covered = true
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
