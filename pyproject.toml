[project]
name = "adjacency"
version = "0.1.0"
description = "A brand-safety policy engine. Compiles advertiser prose into a typed, hashed, diffable PolicySpec, evaluates inventory multimodally, and passes every verdict through deterministic fail-closed gates before reporting the delta against a keyword blocklist."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
# Model and network layer. Kept separate so the deterministic core, which is the
# half that decides most inventory, installs and tests with no model dependency
# at all. `pip install -e .` is enough to run every gate test.
model = [
    "litellm>=1.94.1",
    "httpx>=0.28.1",
    "Pillow>=12.3.0,<13",
]
serve = [
    "gradio>=6.16.0,<7",
    "Pillow>=12.3.0,<13",
]
temporal = [
    "temporalio>=1.31.0,<2",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adjacency"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not e2e' -ra"
testpaths = ["tests"]
markers = [
    "unit: fast hermetic unit tests (no network)",
    "integration: local-fixture integration tests",
    "smoke: wiring/import smoke tests",
    "e2e: end-to-end, requires live API credentials",
    "slow: long-running",
]

[tool.coverage.run]
branch = true
source = ["src/adjacency"]

[tool.coverage.report]
# Coverage is deliberately asymmetric, and the asymmetry is a design statement
# rather than a shortcut.
#
# The deterministic core (contracts.py, gates.py) is held to 100 percent line and
# branch by a dedicated CI step. Those are pure functions, they are the product,
# and a wrong gate invalidates every claim the system makes. Tests there are also
# nearly free: the whole suite runs in about 0.16 seconds.
#
# The remaining package includes lower-risk deterministic helpers plus model,
# network, and UI code. Exhaustive branch coverage on I/O buys much less because
# the gates are the safety net. A bad verdict gets caught by G1 through G6 no
# matter how badly the layer that produced it was written. Those I/O layers use
# fixture-replay integration tests instead.
#
# So this package-wide floor exists only to catch a module that is entirely
# untested. The real gate is the 100 percent core check in CI.
fail_under = 55
skip_covered = true
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
