<text x="217.0" y="335.0" font-size="15" font-weight="600" fill="#2f9e44" text-anchor="middle">FixtureImagineClient</text>
<text x="217.0" y="354.0" font-size="12.5" font-weight="400" fill="#2f9e44" text-anchor="middle">no credential, no socket</text>
<text x="217.0" y="373.0" font-size="12.5" font-weight="400" fill="#2f9e44" text-anchor="middle">missing fixture is TERMINAL</text>
<rect x="413" y="308" width="300" height="83" rx="9" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="563.0" y="335.0" font-size="15" font-weight="600" fill="#c92a2a" text-anchor="middle">Recording / Live client</text>
<text x="563.0" y="354.0" font-size="12.5" font-weight="400" fill="#c92a2a" text-anchor="middle">policy.approved and cap &gt; 0</text>
<text x="563.0" y="373.0" font-size="12.5" font-weight="400" fill="#c92a2a" text-anchor="middle">else refused at construction</text>
<rect x="240" y="453" width="300" height="64" rx="9" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/>
<text x="390.0" y="480.0" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">_admit_call</text>
<text x="390.0" y="499.0" font-size="12.5" font-weight="400" fill="#1971c2" text-anchor="middle">max_calls, max_outputs, cost cap</text>
<rect x="240" y="579" width="300" height="64" rx="9" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/>
<text x="390.0" y="606.0" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">ImagineTransport.invoke</text>
<text x="390.0" y="625.0" font-size="12.5" font-weight="400" fill="#1971c2" text-anchor="middle">EXACTLY ONCE, no retry, no fallback</text>
<rect x="240" y="705" width="300" height="64" rx="9" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/>
<text x="390.0" y="732.0" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">_validate_transport_result</text>
<text x="390.0" y="751.0" font-size="12.5" font-weight="400" fill="#1971c2" text-anchor="middle">request id, model, moderation, latency</text>
<rect x="240" y="831" width="300" height="58" rx="9" fill="#fff9db" stroke="#e67700" stroke-width="1.6"/>
<text x="390.0" y="864.5" font-size="15" font-weight="600" fill="#e67700" text-anchor="middle">Did the provider report cost ticks?</text>
<rect x="67" y="951" width="300" height="64" rx="9" fill="#f8f9fa" stroke="#343a40" stroke-width="1.6"/>
<text x="217.0" y="978.0" font-size="15" font-weight="600" fill="#343a40" text-anchor="middle">CostMeasurement.known</text>
<text x="217.0" y="997.0" font-size="12.5" font-weight="400" fill="#343a40" text-anchor="middle">budget WITHIN_LIMIT</text>
<rect x="413" y="951" width="300" height="64" rx="9" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.6"/>
<text x="563.0" y="978.0" font-size="15" font-weight="600" fill="#c92a2a" text-anchor="middle">CostMeasurement.unknown</text>
<text x="563.0" y="997.0" font-size="12.5" font-weight="400" fill="#c92a2a" text-anchor="middle">BLOCKS every later call</text>
<rect x="240" y="1077" width="300" height="64" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="390.0" y="1104.0" font-size="15" font-weight="600" fill="#2f9e44" text-anchor="middle">Validate, hash, persist bytes</text>
<text x="390.0" y="1123.0" font-size="12.5" font-weight="400" fill="#2f9e44" text-anchor="middle">content-addressed</text>
