<text x="390.0" y="101.5" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">build_imagine_client(mode=...)</text>
<rect x="240" y="188" width="300" height="58" rx="9" fill="#fff9db" stroke="#e67700" stroke-width="1.6"/>
<text x="390.0" y="221.5" font-size="15" font-weight="600" fill="#e67700" text-anchor="middle">Which mode?</text>
