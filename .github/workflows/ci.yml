name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege by default. No job here needs to write anything.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA rather than tag. A tag is mutable and a
      # compromised action tag is a supply-chain foothold with write access to CI.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # --strict and --skip-editable conflict: --strict turns any skip into an error,
      # and this package is installed editable, so it is always skipped. Audit the
      # resolved dependency set instead, which is what we actually care about.
      - name: Audit dependencies for known advisories
        run: |
          pip install pip-audit==2.10.1
          pip freeze --exclude-editable > /tmp/requirements.txt
          pip-audit --no-deps --strict -r /tmp/requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests
          ruff format --check src tests

      - name: Scan for security patterns
        run: |
          pip install bandit==1.9.4
          bandit -q -c pyproject.toml -r src

      # Two gates, deliberately asymmetric.
      #
      # The core is the product. contracts.py and gates.py are pure functions, a
      # wrong gate invalidates every claim the system makes, and the tests cost
      # about 0.16 seconds. That one stays at 100 percent line and branch.
      - name: Deterministic core must stay at 100 percent
        run: |
          pytest -m "not e2e" -q \
            --cov=adjacency.contracts --cov=adjacency.gates \
            --cov-report=term-missing --cov-fail-under=100

      # The remaining package includes lower-risk deterministic helpers and I/O,
      # where the gates are already the safety net. This floor only catches a
      # module that is entirely untested.
      - name: Full suite
        run: |
          pytest -m "not e2e" \
            --cov --cov-report=term-missing \
            --cov-fail-under=55 --junitxml=junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-adjacency
          path: junit.xml

  # The deterministic core must install and pass with no model dependency at all.
  # If this job ever needs `[model]`, the separation has leaked and that is a bug.
  core-without-model-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install without the model extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Assert no model library is importable
        run: |
          python - <<'PY'
          import importlib.util
          for mod in ("litellm", "httpx", "PIL"):
              if importlib.util.find_spec(mod) is not None:
                  raise SystemExit(
                      f"{mod} is importable without the [model] extra. The deterministic "
                      "core must not depend on the model layer."
                  )
          print("core is clean of model dependencies")
          PY

      - name: Run the gate suite
        run: pytest -m "not e2e" -q
